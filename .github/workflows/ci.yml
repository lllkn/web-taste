name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run workflow regression tests
        run: python3 web-taste/scripts/test_workflow.py

      - name: Initialize an isolated taste library
        run: python3 web-taste/scripts/taste_library.py --library-root "$RUNNER_TEMP/web-taste-library" init

      - name: Validate the initialized taste library
        run: python3 web-taste/scripts/taste_library.py --library-root "$RUNNER_TEMP/web-taste-library" validate
